name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            os="${target%_*}"
            arch="${target#*_}"
            mkdir -p "build/$target/skills/alcli"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath -o "build/$target/anilist" .
            cp plugin/skills/alcli/SKILL.md "build/$target/skills/alcli/SKILL.md"
            tar -czf "dist/alcli_${target}.tar.gz" -C "build/$target" anilist skills/alcli/SKILL.md
          done
          scripts/package-plugin.sh "$PWD/dist/alcli-plugin.zip"
          scripts/validate-plugin.py "$PWD/dist/alcli-plugin.zip"
          (cd dist && sha256sum alcli_*.tar.gz alcli-plugin.zip > checksums.txt)
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
